<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capybara to the Moon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one column console; menu/briefing/report are page sections, flight is a 5:3 canvas with HUD and touch pad. Single dark "mission control" look by choice. */
:root{
  --bg:#0b1530; --panel:#13224a; --panel2:#1a2d5e; --line:#2a3f78;
  --fg:#eef3ff; --mut:#a9b7d9; --accent:#f08a24; --accent2:#ffd08a;
  --ok:#3cc47c; --bad:#e85d5d; --info:#3aa0ff;
  --f-body:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px}
body{background:radial-gradient(ellipse at 85% -10%,#24407e 0,transparent 55%),radial-gradient(ellipse at 0 110%,#2a1f5c 0,transparent 50%),var(--bg);background-attachment:fixed;min-height:100%}
.wrap{max-width:1000px;margin:0 auto;padding-block:14px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:900;font-size:19px}.brand b{color:var(--accent)}
.hrow{display:flex;gap:8px;align-items:center}
.pill{font-family:var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--accent2)}
.lang button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:var(--accent);border-color:var(--accent);color:#1b1200;font-weight:900}
h1{font-size:clamp(26px,5vw,40px);margin:14px 0 4px;font-weight:900;line-height:1.1;text-wrap:balance}
h2{font-size:22px;margin:4px 0 6px;font-weight:900;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px}
p{line-height:1.55;margin:6px 0;max-width:68ch}
.mut{color:var(--mut)}.small{font-size:13px}
.eyebrow{font-family:var(--f-mono);color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid>*{min-width:0}
.opt{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;transition:border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.opt:focus-visible,.btn:focus-visible,.pad button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.opt:disabled{cursor:default}
.btn{background:var(--accent);color:#1b1200;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:900;font-size:16px;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.end{justify-content:flex-end;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.tscroll{overflow-x:auto}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:900;letter-spacing:.5px;vertical-align:middle}
.real{background:#3cc47c26;color:#7ee2ab}.rule{background:#f08a2426;color:#ffc27d}
.src{font-size:12px;color:var(--mut);margin-top:8px}
.nasa{background:#163d2c;border:1px solid #2c7a55;border-radius:12px;padding:12px;margin-top:12px}
.warn{background:#3d2a12;border:1px solid #7a5426;border-radius:12px;padding:12px;margin-top:12px}
.effect{background:#1b2547;border:1px dashed #5a6fb0;border-radius:12px;padding:10px 12px;margin-top:10px}
.who{display:flex;align-items:center;gap:10px;margin:6px 0;border-left:5px solid var(--c);padding-left:10px}
.who svg{flex:none}
.keys{font-family:var(--f-mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

/* flight */
#flight{display:none}
.stage{position:relative;width:100%;aspect-ratio:5/3;max-height:72vh;margin:10px auto 0;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:#050b1d;max-width:100%}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.hud small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.hud b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.fuel{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}.fuel i{display:block;height:100%;background:var(--ok)}
.status{font-family:var(--f-mono);font-size:13px;color:var(--accent2);margin-top:8px;min-height:1.4em}
.pad{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center;user-select:none;-webkit-user-select:none}
.pad button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit;font-weight:900;min-width:64px;cursor:pointer;touch-action:none}
.pad button.on{background:var(--accent);color:#1b1200;border-color:var(--accent)}
.pad .thr{min-width:120px;background:#3a2410;border-color:var(--accent)}
.pad .thr.on{background:var(--accent)}

/* modal */
#modal{position:fixed;inset:0;background:#050b1dd9;display:none;overflow:auto;z-index:20;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal .card{max-width:720px;margin:4vh auto}
/* story & rewards */
.story{display:grid;gap:12px;margin-top:14px}
.line{display:flex;gap:12px;align-items:flex-start}
.line.r{flex-direction:row-reverse}
.line svg,.patch svg,.who svg{flex:none}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;max-width:560px;line-height:1.5;min-width:0}
.line.r .bubble{background:var(--panel2)}
.bubble b{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.narr{font-size:13px;color:var(--mut);border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:14px 0}
.patches{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.patch{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);text-align:center;width:96px}
.goalbox{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.goalbox>div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.goalbox .n{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.cert{border:2px solid #ffd166;background:linear-gradient(160deg,#2a2410,#13224a 60%);text-align:center}
.cert h2{color:#ffd166}
footer{margin-top:28px;font-size:12px;color:var(--mut);line-height:1.5;max-width:80ch}
@media (prefers-reduced-motion:reduce){.opt{transition:none}}
</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="brand">🦫 <span id="brandMain">Capybara</span> <b id="brandSub">to the Moon</b></div>
  <div class="hrow"><span class="pill" id="starPill">★ 0</span>
  <span class="lang"><button data-l="en" class="on">EN</button> <button data-l="pt">PT</button></span></div>
</header>
<section id="screen"></section>
<section id="flight">
  <div class="stage"><canvas id="cv" aria-label="Flight simulation"></canvas></div>
  <div class="status" id="status"></div>
  <div class="hud">
    <div><small id="hFuelL">Combustível (Δv)</small><b id="hFuel">0</b><div class="fuel"><i id="hFuelBar"></i></div></div>
    <div><small id="hSpdL">Velocidade</small><b id="hSpd">0</b></div>
    <div><small id="hDistL">Distância à Lua</small><b id="hDist">0</b></div>
    <div><small id="hDomL">Domina a gravidade</small><b id="hDom">—</b></div>
  </div>
  <div class="pad" id="pad">
    <button data-k="left" aria-label="Turn left">⟲</button>
    <button data-k="thrust" class="thr" id="thrBtn">🔥</button>
    <button data-k="right" aria-label="Turn right">⟳</button>
    <button data-k="pro" id="proBtn">PRO</button>
    <button data-k="retro" id="retroBtn">RETRO</button>
    <button data-k="warp" id="warpBtn">⏩</button>
    <button data-k="reset" id="resetBtn">↺</button>
  </div>
  <p class="small mut" id="keysHelp" style="text-align:center;max-width:none"></p>
</section>
<footer id="foot"></footer>
</div>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="modalCard"></div></div>

 return `<svg width="${s}" height="${s}" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="37" fill="${on?c:"#1a2d5e"}" stroke="${gold?"#ffd166":on?"#eef3ff":"#2a3f78"}" stroke-width="${gold?5:3}" ${on?"":'stroke-dasharray="5 5"'}/>

function render(){

 const fl=G.phase==="flight"; $("flight").style.display=fl?"block":"none";
 const s=$("screen");
 s.innerHTML=fl?`<div class="eyebrow" style="margin-top:12px">${MISSIONS[G.mission].name}</div>`:({story:scStory,menu:scMenu,brief:scBrief,report:scReport}[G.phase]||(()=>""))();
 bindScreen(); if(fl) resizeCanvas();
}
function scStory(){

 <div class="story">${t("story").map(([c,s],i)=>`<div class="line ${i%2?"r":""}">${avatar(c,48)}<div class="bubble" style="border-color:${CHARS[c].hex}66"><b style="color:${CHARS[c].hex}">${CHARS[c].name} · ${tx(CHARS[c].role)}</b>${s}</div></div>`).join("")}</div>

 <div class="row" style="justify-content:center;margin:6px 0">${CORE.map(k=>`<div class="patch">${patchSvg(k,"none",64)}<span>${MISSIONS[k].name.replace(/ \(LRO\)/,"")}</span></div>`).join("")}</div>
 <div class="row end"><button class="btn" data-go="menu">${t("begin")}</button></div>`;
}

function startFlight(){
 const m=MISSIONS[G.mission]; G.log=[];G.stars=0;G.result=null;G.sciIdx=0;

  lock:0,engLock:0,spin:0,loose:false,abandon:false,warp:false,hold:0,t:0,noFuelT:0,
  trail:[],events:m.flight.map(([id,p])=>({id,p,done:false})),paused:false,over:false,firing:false,dom:0,maxP:0};

}
function step(h){
 const thrusting=keys.thrust&&F.fuel>0&&F.lock<=0&&F.engLock<=0;

 if(thrusting){const a=F.acc*F.mul;ax+=Math.cos(F.hd)*a;ay+=Math.sin(F.hd)*a;F.fuel=Math.max(0,F.fuel-a*h)}

function relBody(){return F.dom?M:E}

const cv=$("cv"),ctx=cv.getContext("2d");let scale=1,ox=0,oy=0,dpr=1;

addEventListener("resize",()=>{if(G.phase==="flight")resizeCanvas()});
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(G.phase==="flight"&&F&&!F.paused&&!F.over){
  // rotação (tempo real)
  const canTurn=F.lock<=0&&F.spin<=0;
  if(canTurn){
   if(keys.left)F.hd-=2.6*dt; if(keys.right)F.hd+=2.6*dt;
   if(hold){const b=relBody();let ang=Math.atan2(F.vy,F.vx);if(hold==="retro")ang+=Math.PI;
    let d=((ang-F.hd+Math.PI*3)%(Math.PI*2))-Math.PI;F.hd+=Math.max(-3.5*dt,Math.min(3.5*dt,d))}
  }
  const ts=F.warp?8:3,h=.01,n=Math.round(ts*dt/h);

  if(F.trail.length===0||Math.hypot(F.trail[F.trail.length-1][0]-F.x,F.trail[F.trail.length-1][1]-F.y)>4){F.trail.push([F.x,F.y]);if(F.trail.length>500)F.trail.shift()}

  const ev=F.events.find(e=>!e.done&&F.maxP>=e.p);
  if(ev&&!F.over){ev.done=true;F.paused=true;keys.thrust=keys.left=keys.right=false;hold=null;padSync();
   openCard(ev.id,{flight:true,onDone:eff=>{if(eff)eff.f(F);F.paused=false;last=performance.now();if(F.abandon)endFlight("abandon")}})}

}
function checkState(h){
