<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Semana</title>
  <meta name="description" content="Organize compromissos, defina até três metas semanais e revise sua semana. Dados guardados só no seu aparelho.">
  <meta name="theme-color" content="#3f5f8f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151a22" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icone-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="pular" href="#principal">Pular para o conteúdo</a>
  <main id="principal" tabindex="-1"></main>

  <button id="fab" class="fab" type="button" aria-label="Adicionar compromisso" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="navegacao" aria-label="Navegação principal">
    <a href="#/hoje" data-aba="hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Hoje</span>
    </a>
    <a href="#/agenda" data-aba="agenda">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Agenda</span>
    </a>
    <a href="#/metas" data-aba="metas">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      <span>Metas</span>
    </a>
    <a href="#/revisao" data-aba="revisao">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Revisão</span>
    </a>
  </nav>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">O Minha Semana precisa de JavaScript ativado para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
